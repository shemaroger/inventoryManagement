server:
  port: 8080

spring:
  application:
    name: tai-backend

  # Local, git-ignored overrides (mail credentials, etc.) that don't depend on the launching
  # shell having sourced any profile file — works the same whether started from a terminal,
  # an IDE run button, or a task runner. See application-local.yaml.example for the template.
  config:
    import: "optional:file:./application-local.yaml"

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://localhost:5432/tai_db
    username: ${DB_USERNAME:tai_user}
    password: ${DB_PASSWORD:tai_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        transport:
          protocol: smtp
    default-encoding: UTF-8

app:
  mail:
    from: ${EMAIL_USERNAME:no-reply@tai.local}
  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
  upload:
    base-path: ${UPLOAD_BASE_PATH:./uploads/products}
  anomaly:
    quantity-std-dev-threshold: ${ANOMALY_QUANTITY_STD_DEV_THRESHOLD:3.0}
  reorder:
    schedule-cron: ${REORDER_SCHEDULE_CRON:0 0 */6 * * *}
    level-multiplier: ${REORDER_LEVEL_MULTIPLIER:2.0}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    com.company.tai: INFO
    org.springframework.security: INFO
    
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
